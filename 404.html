<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>redirecting...</title>
	<script>
		// Preserve the full requested path (including /jsml prefix) as a query param,
		// then redirect to the app root so index.html can restore it.
		const path = location.pathname + location.search + location.hash;
		location.replace('/jsml/?p=' + encodeURIComponent(path));
	</script>
</head>
<body></body>
</html>
