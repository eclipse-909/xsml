<!DOCTYPE html>
<html lang="en" style="visibility:hidden;">
<head>
	<meta charset="UTF-8">
	<meta
		name="description"
		content="xsml is a very simple pure JavaScript frontend web framework with no magic."
	/>
	<title>xsml</title>
</head>
<body>
	<script>
		// github pages doesn't support SPAs so we embed the path in the params and route based on that
		(function () {
			const params = new URLSearchParams(location.search);
			const redirectPath = params.get('p');
			if (redirectPath) {
				// Restore the real URL (e.g. /xsml/docs) without a page reload,
				// stripping the ?p= param so it doesn't linger in the address bar.
				history.replaceState(null, '', redirectPath);
			}
		})();
	</script>
	<script type="module" async src="gh-pages/app.js"></script>
</body>
</html>
