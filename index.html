<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta
		name="description"
		content="JSML is a very simple pure JavaScript frontend web framework with no magic."
	/>
	<title>JSML</title>
</head>
<body>
	<script>
		(function () {
			const params = new URLSearchParams(location.search);
			const redirectPath = params.get('p');
			if (redirectPath) {
				history.replaceState(null, '', redirectPath);
			}
		})();
	</script>
	<script type="module" src="gh-pages/app.js"></script>
</body>
</html>
